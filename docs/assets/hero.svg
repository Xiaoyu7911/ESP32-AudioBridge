<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="380" viewBox="0 0 1280 380" role="img" aria-labelledby="title desc">
  <title id="title">ESP32 AudioBridge</title>
  <desc id="desc">Desktop audio, on your phone. A wired audio bridge with a desktop, ESP32 chip and phone.</desc>
